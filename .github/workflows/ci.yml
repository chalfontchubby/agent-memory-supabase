name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: deno task check
      - run: deno task test:unit
      - run: supabase db start
      - run: supabase test db
      - run: deno task test:int
      # E2E needs the edge runtime and the model download, so it stays a local step (deno task test:e2e).
